[project]
name = "optersoft-brand"
version = "0.1.0"
description = "The Optersoft chrome for frontage sites: layout, header, footer, the three-way theme, the brand stylesheet and the fonts"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
dependencies = ["frontage>=0.13.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optersoft_brand"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
